<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake YouTube player</title>
<style>
  body { margin: 0; font: 14px sans-serif; }
  #search { display: block; margin: 8px; }
  #movie_player { position: relative; width: 100%; max-width: 640px; aspect-ratio: 16 / 9; background: #000; }
  .video { position: absolute; inset: 0 0 48px 0; }
  .controls { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; gap: 8px; align-items: center; padding: 0 8px; background: #222; }
  .controls button { min-width: 48px; height: 32px; }
  .ytp-settings-menu { position: absolute; right: 8px; bottom: 56px; display: flex; flex-direction: column; background: #333; }
  .ytp-settings-menu[hidden] { display: none; }
  ytd-live-chat-frame { display: block; width: 320px; }
  ytd-live-chat-frame[collapsed] { display: none; }
  #chatframe { width: 100%; height: 200px; border: 0; }
</style>
</head>
<body>
<input id="search" placeholder="Search">
<div id="movie_player" class="html5-video-player">
  <div class="video"></div>
  <div class="controls"></div>
</div>
<button id="open-chat" hidden>Open panel</button>
<div id="secondary"></div>
<script>
  // A stand-in for YouTube's player: the #movie_player element with the API methods and controls the
  // userscripts use. Desktop/embed controls by default; m.youtube.com controls with ?ui=mobile.
  // Tests drive it through window.fake and inspect fake.calls.
  const player = document.getElementById('movie_player');
  const controls = player.querySelector('.controls');
  const mobile = new URLSearchParams(location.search).get('ui') === 'mobile';

  controls.innerHTML = mobile
    ? `<button class="ytmClosedCaptioningButtonButton" aria-pressed="false"><span>CC</span></button>
       <button class="icon-button player-settings-icon" aria-label="Playback Settings"><span>Settings</span></button>`
    : `<button class="ytp-subtitles-button ytp-button" aria-pressed="false"><span class="ytp-subtitles-button-icon">CC</span></button>
       <button class="ytp-settings-button ytp-button"><span>Settings</span></button>
       <button class="ytp-button ytp-autonav-toggle"><div class="ytp-autonav-toggle-button-container"><div class="ytp-autonav-toggle-button"></div></div></button>
       <div class="ytp-settings-menu" hidden>
         <button class="ytp-menuitem" data-captions="off">Captions: Off</button>
         <button class="ytp-menuitem" data-captions="en">Captions: English</button>
       </div>`;
  const ccButton = controls.querySelector('.ytp-subtitles-button, .ytmClosedCaptioningButtonButton');
  // Desktop's Autoplay toggle is always there (though YouTube may hide it); mobile's is only added once
  // the player controls are first shown (fake.showControls()), as on m.youtube.com.
  let autoplayToggle = controls.querySelector('.ytp-autonav-toggle');

  const fake = window.fake = {
    videoId: 'video-1',
    captionsOn: false,
    qualityLevels: ['hd1080', 'hd720', 'large', 'medium', 'small', 'tiny', 'auto'], // highest first
    quality: 'auto',
    hidden: false,
    autoplayOn: true, // YouTube's default
    autoplayReady: true, // false: the toggle ignores clicks, as YouTube's does right after page load
    autoplayApplyDelay: 0, // ms before a click on the toggle takes effect
    autoplayScriptClicks: 0, // clicks on the toggle made by scripts rather than the user
    calls: [], // player API calls made by the userscripts
    setCaptions(on) {
      this.captionsOn = on;
      ccButton.setAttribute('aria-pressed', String(on));
    },
    setAutoplay(on) {
      this.autoplayOn = on;
      if (!autoplayToggle) return;
      autoplayToggle.setAttribute('aria-label', `Autoplay is ${on ? 'on' : 'off'}`);
      if (mobile) autoplayToggle.setAttribute('aria-pressed', String(on));
      else autoplayToggle.querySelector('.ytp-autonav-toggle-button').setAttribute('aria-checked', String(on));
    },
    hideAutoplayToggle() { autoplayToggle.style.display = 'none'; }, // as in YouTube's current desktop layout
    showControls() {
      if (!mobile || autoplayToggle) return;
      const host = document.createElement('player-autonav-toggle');
      host.className = 'ytwPlayerAutonavToggleHost';
      host.innerHTML = '<button class="ytwAutonavToggleButtonHost"><span>Autoplay</span></button>';
      controls.prepend(host);
      autoplayToggle = host.querySelector('button');
      autoplayToggle.addEventListener('click', onAutoplayToggleClick);
      this.setAutoplay(this.autoplayOn);
    },
    setAd(on) { player.classList.toggle('ad-showing', on); },
    loadVideo(id, { captionsOn = false, qualityLevels } = {}) {
      this.videoId = id;
      this.quality = 'auto';
      if (qualityLevels) this.qualityLevels = qualityLevels;
      this.setCaptions(captionsOn);
    },
    removeApi(...names) { for (const name of names) delete player[name]; },
  };

  // Lets tests simulate a background tab.
  Object.defineProperty(document, 'hidden', { configurable: true, get: () => fake.hidden });

  const record = (fn, args) => fake.calls.push({ fn, args: JSON.parse(JSON.stringify(args)) });
  Object.assign(player, {
    getVideoData: () => ({ video_id: fake.videoId }),
    isSubtitlesOn: () => fake.captionsOn,
    setOption(module, option, value) {
      record('setOption', [module, option, value]);
      if (module === 'captions' && option === 'track') fake.setCaptions(!!(value && value.languageCode));
    },
    getAvailableQualityLevels: () => fake.qualityLevels.slice(),
    setPlaybackQualityRange(min, max) { record('setPlaybackQualityRange', [min, max]); fake.quality = max; },
    setPlaybackQuality(q) { record('setPlaybackQuality', [q]); fake.quality = q; },
  });

  // YouTube's own controls: the CC button and "c" shortcut toggle captions; settings has a captions menu.
  ccButton.addEventListener('click', () => fake.setCaptions(!fake.captionsOn));
  document.addEventListener('keydown', (e) => {
    const t = e.target;
    if (e.key !== 'c' || e.ctrlKey || e.metaKey || e.altKey) return;
    if (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    fake.setCaptions(!fake.captionsOn);
  });
  function onAutoplayToggleClick(e) {
    if (!e.isTrusted) fake.autoplayScriptClicks++;
    if (!fake.autoplayReady) return;
    const flip = () => fake.setAutoplay(!fake.autoplayOn);
    if (fake.autoplayApplyDelay) setTimeout(flip, fake.autoplayApplyDelay); else flip();
  }
  fake.setAutoplay(fake.autoplayOn);
  if (autoplayToggle) autoplayToggle.addEventListener('click', onAutoplayToggleClick);
  const menu = controls.querySelector('.ytp-settings-menu');
  if (menu) {
    controls.querySelector('.ytp-settings-button').addEventListener('click', () => { menu.hidden = !menu.hidden; });
    menu.addEventListener('click', (e) => {
      const item = e.target.closest('[data-captions]');
      if (item) { fake.setCaptions(item.dataset.captions !== 'off'); menu.hidden = true; }
    });
  }

  // Live chat, as on www.youtube.com: a ytd-live-chat-frame beside the player holding a same-origin
  // iframe, whose header has the Close button once its content has loaded. Closing collapses the
  // frame; "Open panel" under the video reopens it.
  let chatFrame = null;
  const openChatButton = document.getElementById('open-chat');
  openChatButton.addEventListener('click', () => fake.setChatOpen(true));
  Object.assign(fake, {
    chatCloseReady: true, // false: the Close button ignores clicks
    chatScriptClicks: 0, // clicks on the Close button made by scripts rather than the user
    showLiveChat({ open = true, loaded = true } = {}) {
      chatFrame = document.createElement('ytd-live-chat-frame');
      chatFrame.id = 'chat';
      chatFrame.innerHTML = '<iframe id="chatframe"></iframe>';
      document.getElementById('secondary').append(chatFrame);
      this.setChatOpen(open);
      if (loaded) this.loadLiveChat();
    },
    loadLiveChat() {
      const doc = chatFrame.querySelector('iframe').contentDocument;
      doc.body.innerHTML = `<yt-live-chat-header-renderer>
          <div id="close-button"><yt-button-renderer><yt-button-shape>
            <button aria-label="Close">Close</button>
          </yt-button-shape></yt-button-renderer></div>
        </yt-live-chat-header-renderer>`;
      doc.querySelector('#close-button button').addEventListener('click', (e) => {
        if (!e.isTrusted) this.chatScriptClicks++;
        if (this.chatCloseReady) this.setChatOpen(false);
      });
    },
    setChatOpen(open) {
      chatFrame.toggleAttribute('collapsed', !open);
      openChatButton.hidden = open;
    },
  });
</script>
</body>
</html>
